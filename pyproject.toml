[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freeshow-builder"
version = "1.0.0"
description = "Build FreeShow service presentations from text schedules"
requires-python = ">=3.10"
dependencies = [
    "thefuzz>=0.22.1",
    "python-Levenshtein>=0.25.0",
]

[project.scripts]
build-show = "freeshow_builder.cli:main"

[project.optional-dependencies]
gui = ["PySide6>=6.6.0"]
build = ["pyinstaller>=6.6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["freeshow_builder*"]
