name: Build macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"
          pip install pyinstaller
      
      - name: Build CLI executable
        run: |
          pyinstaller --onefile --name FreeShowBuilder-CLI \
            --collect-submodules freeshow_builder \
            --collect-all PySide6 \
            --paths . \
            scripts/cli_entry.py
      
      - name: Build GUI executable
        run: |
          pyinstaller --onefile --windowed --name FreeShowBuilder \
            --collect-submodules freeshow_builder \
            --collect-all PySide6 \
            --paths . \
            scripts/gui_entry.py
      
      - name: Package
        run: |
          mkdir release
          cp dist/FreeShowBuilder-CLI release/
          cp dist/FreeShowBuilder release/
          cp README.md release/
          chmod +x release/FreeShowBuilder-CLI
          chmod +x release/FreeShowBuilder
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freeshow-builder-macos
          path: release/*