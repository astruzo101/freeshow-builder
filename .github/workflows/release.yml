name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    uses: ./.github/workflows/build-windows.yml

  build-macos:
    uses: ./.github/workflows/build-macos.yml

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: freeshow-builder-windows
          path: artifacts/windows/
      
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: freeshow-builder-macos
          path: artifacts/macos/
      
      - name: Verify artifacts
        run: |
          echo "=== Windows ==="
          find artifacts/windows/ -type f
          echo "=== macOS ==="
          find artifacts/macos/ -type f
      
      - name: Flatten artifacts
        run: |
          mkdir release_files
          cp artifacts/windows/* release_files/ 2>/dev/null || true
          cp artifacts/macos/* release_files/ 2>/dev/null || true
          ls -la release_files/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release_files/*
          generate_release_notes: true