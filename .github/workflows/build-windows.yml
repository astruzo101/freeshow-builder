name: Build Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,build]"

      - name: Build CLI executable
        run: |
          pyinstaller --onefile --name FreeShowBuilder-CLI `
            --hidden-import freeshow_builder.core `
            --hidden-import thefuzz `
            scripts/cli_entry.py

      - name: Build GUI executable
        run: |
          pyinstaller --onefile --windowed --name FreeShowBuilder `
            --hidden-import freeshow_builder.core `
            --hidden-import freeshow_builder.gui `
            --hidden-import PySide6 `
            --hidden-import thefuzz `
            scripts/gui_entry.py

      - name: Package
        run: |
          mkdir release
          copy dist\FreeShowBuilder-CLI.exe release\
          copy dist\FreeShowBuilder.exe release\
          copy README.md release\
          copy LICENSE release\ 2>nul || echo no license

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freeshow-builder-windows
          path: release\*
