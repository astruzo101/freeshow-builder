name: Build Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"
          pip install pyinstaller
      
      - name: Build CLI executable
        run: |
          pyinstaller --onefile --name FreeShowBuilder-CLI `
            --collect-submodules freeshow_builder `
            --collect-all PySide6 `
            --paths . `
            scripts/cli_entry.py
      
      - name: Build GUI executable
        run: |
          pyinstaller --onefile --windowed --name FreeShowBuilder `
            --collect-submodules freeshow_builder `
            --collect-all PySide6 `
            --paths . `
            scripts/gui_entry.py
      
      - name: Package
        run: |
          mkdir release
          copy dist\FreeShowBuilder-CLI.exe release\
          copy dist\FreeShowBuilder.exe release\
          copy README.md release\
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freeshow-builder-windows
          path: release\*